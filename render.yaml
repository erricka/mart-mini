# Render Blueprint — one-click deploy: Render Dashboard → New → Blueprint → pick this repo.
# Creates the app (API + Mini App + dashboard) and a PostgreSQL database in Singapore.
# You'll be asked for the values marked `sync: false`.
services:
  - type: web
    name: mart25
    runtime: node
    region: singapore
    plan: starter            # paid plan: always on (free instances sleep, which delays the bot webhook)
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:                    # keeps uploaded product photos across deploys
      name: uploads
      mountPath: /opt/render/project/src/server/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: mart25-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: MIGRATE_ON_START
        value: "true"
      - key: SEED_ON_START
        value: starter
      - key: TELEGRAM_BOT_MODE
        value: webhook
      - key: TELEGRAM_BOT_TOKEN       # from @BotFather
        sync: false
      - key: TELEGRAM_BOT_USERNAME    # without @
        sync: false
      - key: ADMIN_TELEGRAM_IDS       # your Telegram user id (from @userinfobot), comma-separated
        sync: false
      # PUBLIC_URL is detected automatically on Render. Set it only when you add a custom domain.

databases:
  - name: mart25-db
    region: singapore
    plan: basic-256mb
    databaseName: mart25
    user: market
