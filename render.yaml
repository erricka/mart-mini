# Render Blueprint — one-click deploy: Render Dashboard → New → Blueprint → pick this repo.
# Creates the app (API + Mini App + dashboard) on Render's free plan, in Singapore.
# The database is a free Neon Postgres (https://neon.com, region Singapore) — paste its connection
# string as DATABASE_URL. You'll be asked for the values marked `sync: false`.
services:
  - type: web
    name: mart25
    runtime: node
    region: singapore
    # Starter ($7/month): always on, no wake-up wait. (`free` sleeps after 15 min without visitors.)
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL           # Neon connection string (postgresql://…neon.tech/neondb?sslmode=require)
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: MIGRATE_ON_START
        value: "true"
      - key: SEED_ON_START
        value: starter
      - key: TELEGRAM_BOT_MODE
        value: webhook
      - key: TELEGRAM_BOT_TOKEN       # from @BotFather
        sync: false
      - key: TELEGRAM_BOT_USERNAME    # without @
        sync: false
      - key: ADMIN_TELEGRAM_IDS       # your Telegram user id (from @userinfobot), comma-separated
        sync: false
      # Optional: GOOGLE_MAPS_API_KEY (Google Maps with address auto-fill) — add it under Environment.
      # PUBLIC_URL is detected automatically on Render. Set it only when you add a custom domain.

